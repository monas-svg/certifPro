events {}
http {
  server_tokens off;

  upstream site    { server site-public:8000; }
  upstream catalog { server catalog-service:8001; }
  upstream orders  { server order-service:8002; }
  upstream pay     { server payment-service:8003; }

  server {
    listen 80;
    client_max_body_size 5m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/metiers/  { proxy_pass http://catalog; }
    location /api/internal/ { proxy_pass http://catalog; }
    location /api/orders/   { proxy_pass http://orders;  }
    location /api/payments/ { proxy_pass http://pay;     }

    location / {
      proxy_pass http://site;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
