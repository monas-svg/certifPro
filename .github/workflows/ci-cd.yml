name: CI/CD - certifPro

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/certifpass

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

    deploy-pr:
    name: PR de mise à jour de l'image
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Met à jour le tag de l'image
        run: sed -i "s|image: .*certifpass:.*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" docker-compose.yml
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: deploy/${{ github.sha }}
          commit-message: "Déploiement de l'image ${{ github.sha }}"
          title: "Déploiement ${{ github.sha }}"
          body: "Met à jour docker-compose.yml avec l'image construite par la CI."
    
